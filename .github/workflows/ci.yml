name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: 额外运行 Playwright 端到端（需安装 Chromium，耗时更长）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Build · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Playwright E2E (optional)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PATH: ${{ runner.temp }}/dajia-e2e.db
      PORT: "8787"
      HOST: 127.0.0.1
      APP_URL: http://127.0.0.1:8787
      NODE_ENV: development
      DEV_MAIL: "1"
      REQUIRE_VERIFIED_TO_POST: "1"
      NOTIFY_WORKER: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Seed and start app
        run: |
          pnpm seed --force
          nohup node server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then
              echo "app is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "app failed to start"
          cat server.log
          exit 1

      - name: Run E2E
        env:
          E2E_BASE: http://127.0.0.1:8787
          E2E_CHANNEL: none
        run: python tests/e2e.py

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-log
          path: server.log
          if-no-files-found: ignore
          retention-days: 7
